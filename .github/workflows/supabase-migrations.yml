name: Aplicar Migrations no Supabase

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo Simulação (Dry Run): apenas verifica sem aplicar ao banco'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrate:
    name: Supabase DB Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verificar Integridade das Migrations (Dry Run)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || vars.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "Verificando arquivos de migração existentes em supabase/migrations/..."
          ls -la supabase/migrations/
          
          # Se o token estiver configurado, vincula ao projeto remoto
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_ID" ]; then
            echo "Vinculando ao projeto Supabase $SUPABASE_PROJECT_ID..."
            supabase link --project-ref "$SUPABASE_PROJECT_ID"
          else
            echo "Aviso: SUPABASE_ACCESS_TOKEN ou SUPABASE_PROJECT_ID não configurados nos Secrets do GitHub."
            exit 1
          fi

      - name: Aplicar Migrations no Banco de Dados Remoto
        if: ${{ !inputs.dry_run }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || vars.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "Aplicando migrations versionadas com segurança..."
          supabase db push --password "$SUPABASE_DB_PASSWORD"
          echo "Migrations aplicadas com sucesso!"
